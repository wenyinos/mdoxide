# Dependabot: weekly dependency update PRs for Cargo and GitHub Actions.
# CI (.github/workflows/ci.yml) runs cargo check/test on every PR, so update
# PRs are validated before merge.
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Only patch bumps are grouped. Many dependencies are pre-1.0, where a
      # "minor" bump can be breaking, so those get individual PRs.
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # This ref is the Rust toolchain version (1.92.0 pinned in
      # rust-toolchain.toml), not an action release tag. Bumping it would
      # silently move the MSRV.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
