name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-packages:
    name: Linux packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@1.120.0

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build DEB and RPM
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p dist
          cargo deb --no-build
          cargo generate-rpm
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: mdoxide-linux-${{ matrix.arch }}
          path: dist/*

  windows-installer:
    name: Windows installer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "makensis.exe not found under $nsis"
          }
          "NSIS_DIR=$nsis" >> $env:GITHUB_ENV

      - name: Build NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "$env:NSIS_DIR\makensis.exe" /DVERSION=$version /DARCH=${{ matrix.arch }} "/DBIN_DIR=${{ matrix.target }}/release" installer/windows/mdoxide.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: mdoxide-windows-${{ matrix.arch }}
          path: dist/*.exe

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-packages, windows-installer]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare checksums and release notes
        run: |
          cd dist
          sha256sum *.deb *.rpm *.exe > checksums.txt
          cd ..
          if [ -f "docs/release-notes/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/release-notes/${GITHUB_REF_NAME}.md" release-body.md
          else
            printf '# MDOxide %s\n' "${GITHUB_REF_NAME}" > release-body.md
          fi
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-body.md
          draft: false
