# CI — compile and test with the project toolchain (rust-toolchain.toml)
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# One run per branch: a new push cancels the previous in-flight build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev

      - name: Install Rust (MSRV from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.92.0

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSRV from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.92.0

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked
